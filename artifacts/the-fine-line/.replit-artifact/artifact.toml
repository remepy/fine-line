kind = "web"
previewPath = "/"
title = "The Fine Line"
version = "1.0.0"
id = "artifacts/the-fine-line"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18881

[services.development]
run = "pnpm --filter @workspace/the-fine-line run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/the-fine-line", "run", "build" ]
publicDir = "artifacts/the-fine-line/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18881"
BASE_PATH = "/"
